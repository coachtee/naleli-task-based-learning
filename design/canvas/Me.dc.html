<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
    :root{
      --bg:#071525; --surface:#0D2138; --surface-elevated:#132A45;
      --primary:#1677FF; --active:#2997FF; --light-blue:#8CCBFF;
      --text:#F4F7FB; --text-secondary:#AAB8C8; --border:#29415A;
      --required:#DC2626; --supporting:#2563EB; --assessment:#7C3AED;
      --competent:#059669; --current:#D97706; --locked:#6B7280;
    }
    *{box-sizing:border-box; margin:0; padding:0;}
    body{background:transparent;}
    .frame{ width:390px; height:844px; background:var(--bg); border-radius:32px; border:1px solid var(--border); overflow:hidden; position:relative; font-family:'IBM Plex Sans',sans-serif; color:var(--text); display:flex; flex-direction:column; }
    .scroll{flex:1; overflow-y:auto; display:flex; flex-direction:column; padding:20px 20px 8px;}
    .t-display{font-family:'Plus Jakarta Sans',sans-serif; font-size:18px; font-weight:600;}
    .t-body{font-size:14px; font-weight:400; line-height:1.5; color:var(--text-secondary);}
    .t-label{font-size:11px; font-weight:600; letter-spacing:0.07em; text-transform:uppercase; color:var(--light-blue);}
    .row{display:flex; align-items:center; gap:14px; padding:13px 0;}
    .rowlabel{font-size:14px; font-weight:500; font-family:'IBM Plex Sans',sans-serif; color:var(--text); flex:1;}
    .divider{height:1px; background:var(--border); opacity:0.5;}
    .navbar{display:flex; border-top:1px solid var(--border); background:var(--surface); padding:10px 8px 16px;}
    .navitem{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;}
    .navlabel{font-size:10px; font-weight:500; font-family:'Plus Jakarta Sans',sans-serif;}
  </style>
</helmet>
