<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
    :root{
      --bg:#071525; --surface:#0D2138; --surface-elevated:#132A45;
      --primary:#1677FF; --active:#2997FF; --light-blue:#8CCBFF;
      --text:#F4F7FB; --text-secondary:#AAB8C8; --border:#29415A;
      --required:#DC2626; --supporting:#2563EB; --assessment:#7C3AED;
      --competent:#059669; --current:#D97706; --locked:#6B7280;
    }
    *{box-sizing:border-box; margin:0; padding:0;}
    body{background:transparent;}
    .frame{ width:390px; height:844px; background:var(--bg); border-radius:32px; border:1px solid var(--border); overflow:hidden; position:relative; font-family:'IBM Plex Sans',sans-serif; color:var(--text); display:flex; flex-direction:column; }
    .scroll{flex:1; overflow-y:auto; display:flex; flex-direction:column; padding:20px 20px 28px;}
    .t-display{font-family:'Plus Jakarta Sans',sans-serif; font-size:22px; font-weight:600;}
    .t-title{font-family:'Plus Jakarta Sans',sans-serif; font-size:15px; font-weight:600;}
    .t-body{font-size:14px; font-weight:400; line-height:1.5; color:var(--text-secondary);}
    .t-label{font-size:12px; font-weight:500; letter-spacing:0.05em; text-transform:uppercase; color:var(--text-secondary);}
    .btn-primary{background:var(--primary); color:#fff; font-family:'Plus Jakarta Sans',sans-serif; font-size:14px; font-weight:600; border:none; border-radius:10px; padding:14px 20px; display:flex; align-items:center; justify-content:center; gap:8px; width:100%;}
    .tile{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 8px; color:var(--light-blue); }
    .tilelabel{font-size:12px; font-weight:600; font-family:'Plus Jakarta Sans',sans-serif; color:var(--text);}
    .divider{height:1px; background:var(--border); width:100%;}
  </style>
</helmet>
<div class="frame">
  <div class="scroll">

    <div style="display:flex; align-items:center; gap:10px; margin-bottom:24px;">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="#AAB8C8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="t-label">Task Workspace</div>
    </div>

    <div style="display:flex; flex-direction:column; gap:4px; margin-bottom:28px;">
      <div class="t-display">Submit Evidence</div>
      <div class="t-body">What did you create for &ldquo;Create a Professional Document&rdquo;?</div>
    </div>

    <div style="display:flex; gap:12px; margin-bottom:26px;">
      <div class="tile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 16V4M12 4L7 9M12 4l5 5" stroke="#8CCBFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" stroke="#8CCBFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="tilelabel">Upload File</div>
      </div>
      <div class="tile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 8a2 2 0 0 1 2-2h1.2l.8-1.5A1 1 0 0 1 8.9 4h6.2a1 1 0 0 1 .9.6L16.8 6H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z" stroke="#8CCBFF" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.2" stroke="#8CCBFF" stroke-width="1.6"/></svg>
        <div class="tilelabel">Take Photo</div>
      </div>
      <div class="tile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M9 15l6-6M10 6.5l1-1a3.5 3.5 0 0 1 5 5l-1 1M14 17.5l-1 1a3.5 3.5 0 0 1-5-5l1-1" stroke="#8CCBFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="tilelabel">Add Link</div>
      </div>
    </div>

    <div style="display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:var(--surface); border:1px solid var(--border); border-radius:12px; margin-bottom:28px;">
      <div style="display:flex; align-items:center; gap:12px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M14 3.5H6.5A1.5 1.5 0 0 0 5 5v14a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19V8.5L14 3.5Z" stroke="#AAB8C8" stroke-width="1.5" stroke-linejoin="round"/><path d="M14 3.5V8h4.5" stroke="#AAB8C8" stroke-width="1.5" stroke-linejoin="round"/></svg>
        <div style="display:flex; flex-direction:column; gap:1px;">
          <div class="t-body" style="color:var(--text); font-weight:500;">Business_Letter_v1.docx</div>
          <div class="t-label" style="font-size:11px;">1.2 MB</div>
        </div>
      </div>
      <div class="t-label" style="color:#F87171;">Remove</div>
    </div>

    <div class="t-label" style="margin-bottom:12px;">Evidence Checklist</div>
    <div style="display:flex; flex-direction:column; gap:12px; margin-bottom:32px;">
      <div style="display:flex; align-items:center; gap:10px;">
        <svg width="17" height="17" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#132A45" stroke="#059669" stroke-width="1.5"/><path d="M5 8.2L7 10.2L11 6" stroke="#059669" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        <div class="t-body" style="color:var(--text);">Evidence attached</div>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <svg width="17" height="17" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.25" stroke="#AAB8C8" stroke-width="1.5" fill="none"/></svg>
        <div class="t-body" style="color:var(--text);">File name checked</div>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <svg width="17" height="17" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.25" stroke="#AAB8C8" stroke-width="1.5" fill="none"/></svg>
        <div class="t-body" style="color:var(--text);">Ready for submission</div>
      </div>
    </div>

    <div style="flex:1;"></div>
    <button class="btn-primary">Submit for Assessment</button>

  </div>
</div>
</x-dc>
</body>
</html>
