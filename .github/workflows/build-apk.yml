name: Build Debug APK

# GitHub-hosted runners have normal internet access (unlike the sandboxed
# session this project was first built in), so this is where the debug APK
# actually gets produced. Builds on every push to the V1 branch and can also
# be triggered manually. Publishes the APK as both a workflow artifact and a
# GitHub Release, so it's reachable as a plain tap-to-download link from a
# phone without needing to open Actions.

on:
  push:
    branches:
      - claude/naleli-v1-init-scz7nk
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "source/**"
      - "backend/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: naleli-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Write release notes
        run: |
          cat > release-notes.md << 'NOTES_EOF'
          Automated debug build from this commit on the V1 branch.

          **Install:** download `app-debug.apk` on your phone, open it, and allow "install unknown apps" for whatever app you downloaded it with. This is a debug build, not a signed release build.

          **Content included:** the full 90-day Digital Foundation programme, converted from the course workbook — 23 workstreams, 90 daily tasks, 371 sub-steps across the four phases. Days unlock sequentially, so a fresh install starts at Day 1. See `docs/CONTENT-MODEL.md` for how the content is built and `docs/ROADMAP.md` for what's next.
          NOTES_EOF

      - name: Publish GitHub Release with APK attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1-debug-${{ github.run_number }}"
          gh release create "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Naleli Task-Based Learning V1 - debug build ${{ github.run_number }}" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}"
